<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="app-icon">

            <!-- ===== DEFINITIONS ===== -->
            <defs>
               <linearGradient id="metube-bgGradientDark" x1="50" y1="0" x2="50" y2="100" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#525755"/>
                    <stop offset="0.52" stop-color="#232625"/>
                    <stop offset="1" stop-color="#181A19"/>
               </linearGradient>
               <linearGradient id="metube-iconGradient" x1="50" y1="31" x2="50" y2="69" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#E2423E"/>
                    <stop offset="1" stop-color="#A80B38"/>
               </linearGradient>
               <linearGradient id="metube-bgGradient" x1="50" y1="0" x2="50" y2="100" gradientUnits="userSpaceOnUse">
                    <stop offset="0.0576923" stop-color="#E5413F"/>
                    <stop offset="1" stop-color="#A80B38"/>
               </linearGradient>
            </defs>

            <!-- ================= DARK ================= -->
            <g class="icon-dark" style="display: none;">
                <!-- Dark gradient background -->
                <rect width="100" height="100" fill="url(#metube-bgGradientDark)" />

                <!-- Red gradient icon -->
                <path fill-rule="evenodd" clip-rule="evenodd" d="M77 69H23V31H77V69ZM43 59L59 50L43 41V59Z" fill="url(#metube-iconGradient)"/>
            </g>

            <!-- ================= TINTED ================= -->
            <g class="icon-tinted" style="display: none;">
                <!-- Solid background (theme controlled) -->
                <rect width="100" height="100" fill="var(--icon-bg, #D9D9D9)" />

                <!-- Tintable icon -->
                <path fill-rule="evenodd" clip-rule="evenodd" d="M77 69H23V31H77V69ZM43 59L59 50L43 41V59Z" fill="currentColor"/>
            </g>

            <!-- ================= DEFAULT ================= -->
            <g class="icon-default" style="display: block;">
                <!-- Red gradient background -->
                <rect width="100" height="100" fill="url(#metube-bgGradient)" />

                <!-- White icon -->
                <path fill-rule="evenodd" clip-rule="evenodd" d="M77 69H23V31H77V69ZM43 59L59 50L43 41V59Z" fill="white"/>
            </g>

        </svg>
